<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxShadowGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="var(--accent, #1e3a5f)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--accent, #1e3a5f)" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="innerVoidGrad" x1="50%" x2="50%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-container, #d5e3fc)" stop-opacity="0.65" />
      <stop offset="100%" stop-color="var(--canvas, #ffffff)" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Circular grid guideline -->
  <circle cx="100" cy="108" opacity="0.4" r="68" stroke="var(--border-hover, #94a3b8)" stroke-dasharray="3 4" stroke-width="0.8" />

  <!-- Crosshair guidelines -->
  <line opacity="0.6" stroke="var(--border, #e5e7eb)" stroke-dasharray="2 3" stroke-width="0.8" x1="100" x2="100" y1="20" y2="180" />
  <line opacity="0.6" stroke="var(--border, #e5e7eb)" stroke-dasharray="2 3" stroke-width="0.8" x1="24" x2="176" y1="108" y2="108" />

  <!-- Ambient floor shadow -->
  <ellipse cx="100" cy="162" fill="url(#boxShadowGrad)" rx="46" ry="14" />

  <!-- Isometric box facets -->
  <polygon fill="url(#innerVoidGrad)" points="100,84 136,104 100,124 64,104" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.4" />
  <polygon fill="var(--canvas, #ffffff)" fill-opacity="0.85" points="64,104 100,124 100,158 64,138" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.5" />
  <polygon fill="var(--surface-container, #e9edff)" fill-opacity="0.5" points="100,124 136,104 136,138 100,158" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.5" />

  <!-- Flaps / unfolding faces -->
  <polygon fill="var(--canvas, #ffffff)" fill-opacity="0.9" points="64,104 100,84 82,72 46,92" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.35" />
  <polygon fill="var(--canvas, #ffffff)" fill-opacity="0.65" points="100,84 136,104 154,92 118,72" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.35" />
  <polygon fill="var(--canvas, #ffffff)" fill-opacity="0.9" points="64,104 100,124 82,142 46,122" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.35" />
  <polygon fill="var(--accent-container, #d5e3fc)" fill-opacity="0.5" points="100,124 136,104 154,122 118,142" stroke="var(--accent, #1e3a5f)" stroke-linejoin="round" stroke-width="1.35" />

  <!-- Floating Question Mark & Accents -->
  <path d="M100 86 V68" opacity="0.5" stroke="var(--accent, #1e3a5f)" stroke-dasharray="2 2" stroke-width="1" />
  <path d="M92 48 C92 42 96 38 100 38 C104.4 38 108 41.5 108 45.8 C108 49.5 105.5 52.2 101.8 54.4 C100.2 55.4 99.8 56.8 99.8 59 V63" stroke="var(--accent, #1e3a5f)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" />
  <circle cx="99.8" cy="70.5" fill="var(--accent, #1e3a5f)" r="1.4" />
  <circle cx="116" cy="44" fill="var(--accent, #1e3a5f)" opacity="0.5" r="2" />
  <circle cx="84" cy="52" fill="var(--accent, #1e3a5f)" opacity="0.35" r="1.5" />

  <!-- Corner registration marks -->
  <path d="M38 38 h8 m-8 0 v8" opacity="0.35" stroke="var(--border-hover, #94a3b8)" stroke-width="1" />
  <path d="M162 38 h-8 m8 0 v8" opacity="0.35" stroke="var(--border-hover, #94a3b8)" stroke-width="1" />
  <path d="M38 162 h8 m-8 0 v-8" opacity="0.35" stroke="var(--border-hover, #94a3b8)" stroke-width="1" />
  <path d="M162 162 h-8 m8 0 v-8" opacity="0.35" stroke="var(--border-hover, #94a3b8)" stroke-width="1" />
</svg>
